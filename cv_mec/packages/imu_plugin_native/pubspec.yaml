name: imu_plugin_native
description: Native Android IMU sensor channel plugin.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.neaera.imu_plugin_native
        pluginClass: ImuPluginNativePlugin

name: cv_mec
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 12.2.0+87

environment:
  sdk: ">=3.4.3 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  package_info_plus: ^8.0.0
  aws_client: ^0.7.1
  cupertino_icons: ^1.0.6
  geolocator: ^12.0.0
  logger: ^2.3.0
  get: ^4.6.6
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  shared_preferences: ^2.2.3 # This dependency caused issues with path_provide on version 2.5.3, downgraded to resolve for now.
  native_device_orientation: ^2.0.3
  mqtt_client: ^10.2.1
  flutter_kronos_plus:
    path: ./packages/flutter-kronos-plus
  ntp: ^2.0.0
  protobuf: ^3.1.0
  typed_data: ^1.3.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  flutter_launcher_icons: ^0.13.1

  fixnum: any
  flutter_secure_storage: ^9.2.2
  connection_network_type: ^0.0.1

  asn1_plugin:
    path: asn1_plugin
  geobase: ^1.3.0
  latlong2: ^0.9.1
  dart_jts: ^0.3.0+1
  geodesy: ^0.10.2
  uuid: ^4.5.0
  toastification: ^2.2.0
  image: ^4.2.0
  map: ^2.0.2
  flutter_map: ^7.0.2
  carousel_slider: ^5.0.0
  flutter_spinkit: ^5.2.1
  device_info_plus: ^11.2.0
  wakelock_plus: ^1.2.10
  archive: ^4.0.2
  flutter_tts: ^4.2.2
  app_settings: ^6.1.1
  conversion: ^1.0.0+1
  bluetooth_classic: ^0.0.4
  aws_s3_upload_lite:
    path: ./packages/aws_s3_upload_lite
  audioplayers: ^5.2.1
  flutter_libserialport:
    git: 
      url: https://github.com/neaeraconsulting/flutter_libserialport.git
      ref: main
  bluez: ^0.8.3
  iss_scms:
    path: ./packages/iss_scms
  connectivity_plus: ^7.0.0
  app_tracking_transparency: ^2.0.6+1
  dart_geohash: ^2.1.0
  yaml_edit: ^2.2.4
  auto_size_text_pro: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.3.3
  json_serializable: ^6.8.0
  image: ^4.2.0

flutter:
  # default-flavor: v2x_mobile_app
  uses-material-design: true
  assets:
    - assets/images/Default/
    - assets/images/Custom/
    - assets/images/Bus/
    - assets/images/generic/
    - assets/images/ITIS/
    - assets/images/Lights/
    - assets/images/Siren/
    - assets/images/tims/
    - assets/images/Vehicle_config_icons/
    - assets/fonts/
    - assets/audio/
    - assets/tims.json
    - .env

  # fonts:
  #   - family: HighwayGothic
  #     fonts:
  #       - asset: assets/font/HighwayGothic.ttf

ffigen:
  output: "lib/generated_bindings.dart"
  llvm-path:
    - 'C:\Program Files\LLVM\bin'
  headers:
    entry-points:
      # - "generated-files/2020/asn_application.h"
      # - "generated-files/2020/asn_internal.h"
      # - "generated-files/2020/MessageFrame.h"
      - "src/asn1_plugin.h"
    include-directives:
      - "src/**.h"
      - "**index.h"
      - "**/clang-c/**"
  name: "NativeBindings"
  description: "Bindings for NativeCode"
  silence-enum-warning: true
